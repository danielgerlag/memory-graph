name: Deterministic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git --no-lazy-fetch --version
      - run: python -m pip install uv==0.11.32
      - run: uv sync --locked --group dev --group eval --python 3.12
      - run: uv lock --check
      - run: uv run --locked --group dev --group eval python evals/build_dataset.py
      - run: uv run --locked --group dev --group eval ruff check .
      - run: uv run --locked --group dev --group eval ruff format --check .
      - run: uv run --locked --group dev --group eval mypy --ignore-missing-imports memory-graph/scripts/memory_graph
      - run: uv run --locked --group dev --group eval pytest
      - run: uv sync --locked --project memory-graph --python 3.12
