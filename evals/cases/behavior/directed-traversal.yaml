# Case: Find what the cart carries by following its outgoing carries edge. Ignore
# the incoming edge from the shed and return only the direct target.
id: directed-traversal
category: traversal
prompts:
  - What does the red cart carry directly?
scope: orchard
fixture:
  main:
    nodes:
      cart:
        label: red cart
        edges:
          - label: carries
            to: tools
      tools:
        label: tools
      shed:
        label: shed
        edges:
          - label: carries
            to: cart
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: traversal
  query: red cart
  root: cart
  edge: carries
  depth: 1
  targets: [tools]
  facts: [tools]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - tools
  - path: /graph/main/edges
    op: contains
    value:
      from: cart
      label: carries
      to: tools
  - path: /query/depth
    op: equals
    value: 1
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 5
