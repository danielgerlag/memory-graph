# Case: At the fixed evaluation time, exclude the expired schedule from ordinary
# recall and identify the current schedule as due for review.
id: expired-review
category: lifecycle
prompts:
  - What is current, and what needs review?
scope: orchard
fixture:
  main:
    nodes:
      expired:
        label: old schedule
        expires_at: '2026-01-01T00:00:00Z'
      review:
        label: current schedule
        review_at: '2026-01-10T00:00:00Z'
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: timed-review
  query: schedule
  targets: [review]
  facts: [current schedule]
  instruction: "Treat the evaluation clock as $clock; do not modify the store. For a review-due node,
    use notice 'review due: <node_id>'."
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - review
  - path: /answer/notices
    op: contains
    value: 'review due: review'
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 9
