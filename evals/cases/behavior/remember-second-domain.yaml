# Case: Store a reported workshop fact with its stated source in a different scope.
# Treat the card as a user report, not a directly inspected artifact.
id: remember-second-domain
category: remember
prompts:
  - 'Keep a note: the ceramic wheel uses a blue belt, as recorded on the workshop card.'
scope: workshop
fixture:
  main:
    nodes: {}
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: create
  facts: [ceramic wheel uses blue belt]
  sources: [card:wheel]
  instruction: Use operation ID $operation_id. This is a user report, not a direct artifact
    inspection; its interaction source ref is $source, observed at $clock. Preserve the scope and
    evidence.
allowed_mutations: [node:create, receipt:create]
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /graph/main/facts
    op: contains
    value:
      label: ceramic wheel uses blue belt
      scope: workshop
      sources:
        - card:wheel
  - path: /graph/main/facts/length
    op: equals
    value: 1
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 1
