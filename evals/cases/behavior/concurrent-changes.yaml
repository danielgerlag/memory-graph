order: 20
id: concurrent-changes
lane: behavior
category: publication
prompts:
- Check my blue-cart report against the competing update; retain both reports and surface any
  conflict.
fixture:
  store:
    id: shared-orchard
    mode: propose
    main_ref: commit-base
    remote_rules: accept only validated current-base proposals
    base_ref: commit-base
    actor_capabilities:
      read: true
      propose: true
      write: false
    operation_id: op-conflict
    allowed_branch_changes:
    - proposal
    isolation_profile: managed-single-store
  remote_main_ref: commit-other
  operation_id: op-conflict
  competing_operation_id: op-competing
  main:
    directory: fixtures/graphs/concurrent-changes
    nodes:
    - alias: cart
      file: c5e48aaf-7e57-4cf4-84fe-c274cfdfb4f4.md
      fields:
      - label
      - scope
      - id
      - sources
  pending_update:
    id: cart
    label: cart is blue
    status: disputed
    body: Witness a reported red; witness c reported blue.
    sources:
    - witness:a
    - witness:c
  competing_update:
    id: cart
    label: cart is green
    status: disputed
    body: Witness a reported red; witness b reported green.
    sources:
    - witness:a
    - witness:b
scope: orchard
clock: '2026-01-15T12:00:00Z'
allowed_mutations:
- ref:fetch
forbidden_actions:
- force_push
- delete_proposal
- resolve_conflict_silently
checks:
- path: /answer/notices
  op: contains
  value: conflict
- path: /publication/state
  op: equals
  value: conflict
- path: /publication/main_ref
  op: equals
  value: commit-other
- path: /graph/main/facts
  op: contains
  value:
    label: cart is green
    scope: orchard
    id: cart
    status: disputed
    sources:
    - witness:a
    - witness:b
- path: /publication/retained_proposal
  op: contains
  value:
    label: cart is blue
    scope: orchard
    id: cart
    status: disputed
    sources:
    - witness:a
    - witness:c
- path: /publication/stale_rejected
  op: equals
  value: true
controlled:
  blocked: Local publication is refused; the hook-free sandbox has no verified remote transport or
    current-base acceptance policy.
