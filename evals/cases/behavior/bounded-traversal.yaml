# Case: Follow directed connections from A for at most two hops. Return B and C, but
# not the node beyond the requested depth.
id: bounded-traversal
category: traversal
prompts:
  - Follow connects from A for at most two hops.
scope: orchard
fixture:
  main:
    nodes:
      A:
        label: A
        edges:
          - label: connects
            to: B
      B:
        label: B
        edges:
          - label: connects
            to: C
      C:
        label: C
        edges:
          - label: connects
            to: D
      D:
        label: D
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: traversal
  query: A
  root: A
  edge: connects
  depth: 2
  targets: [B, C]
  facts: [B, C]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - B
      - C
  - path: /query/depth
    op: equals
    value: 2
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 6
