# Case: Read the accepted snapshot of a read-only shared store and report its store
# and commit provenance without publishing changes.
id: shared-read
category: shared-store
prompts:
  - Read the shared orchard record and cite its snapshot.
scope: orchard
fixture:
  store:
    id: shared-orchard
    mode: read
    main_ref: commit-shared-1
    base_ref: commit-shared-1
    actor_capabilities:
      read: true
      propose: false
      write: false
    remote_rules: no implicit publication
    operation_id:
    allowed_branch_changes: []
    isolation_profile: managed-single-store
  main:
    nodes:
      cart:
        label: cart is red
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: shared-read
  query: cart
  targets: [cart]
  facts: [cart is red]
  instruction: The record concerns the cart. The selected store is attached read-only to a local
    synthetic remote; do not modify it.
allowed_mutations: []
forbidden_actions: [publish]
# Additional checks for imported evidence.
checks:
  - path: /answer/store_id
    op: equals
    value: shared-orchard
  - path: /answer/commit
    op: equals
    value: commit-shared-1
  - path: /answer/facts
    op: contains
    value: cart is red
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 18
