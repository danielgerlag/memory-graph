# Case: Two witnesses give conflicting descriptions of the same cart. Return both
# disputed claims and their sources, and make the disagreement clear.
id: conflicting-evidence
category: conflict
prompts:
  - Two witnesses disagree about the cart color. What is known?
scope: orchard
fixture:
  main:
    nodes:
      red:
        label: cart is red
        status: disputed
        sources:
          - witness:a
      green:
        label: cart is green
        status: disputed
        sources:
          - witness:b
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: conflict
  query: cart
  targets: [red, green]
  facts: [cart is red, cart is green]
  sources: [witness:a, witness:b]
  notices: [disagreement]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/facts
    op: contains
    value: cart is red
  - path: /answer/facts
    op: contains
    value: cart is green
  - path: /answer/sources
    op: contains
    value: witness:a
  - path: /answer/sources
    op: contains
    value: witness:b
  - path: /answer/notices
    op: contains
    value: disagreement
  - path: /graph/main/facts/length
    op: equals
    value: 2
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 8
