# Case: Answer from the existing seed-tin memory without changing the graph or its
# expiration.
id: read-only
category: read-only
prompts:
  - What do we know about the seed tin? Just answer, changing nothing.
scope: orchard
fixture:
  main:
    nodes:
      seed-1:
        label: seed tin is dry
        expires_at: '2026-03-01T00:00:00Z'
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: timed-read
  query: seed
  targets: [seed-1]
  facts: [seed tin is dry]
  instruction: "Treat the evaluation clock as $clock; do not modify the store. For a review-due node,
    use notice 'review due: <node_id>'."
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/facts
    op: contains
    value: seed tin is dry
  - path: /graph/main/facts
    op: contains
    value:
      label: seed tin is dry
      scope: orchard
      id: seed-1
      expires_at: '2026-03-01T00:00:00Z'
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 14
