# Case: A stored claim has changed. Create the corrected claim and supersede the old
# one atomically, preserving the earlier report and its source.
id: atomic-correction
category: correction
prompts:
  - The kite moved to the barn; preserve the earlier report.
scope: orchard
fixture:
  main:
    nodes:
      old:
        label: amber kite stored in loft
        status: active
        sources:
          - interaction:earlier
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: correction
  query: kite
  targets: [old]
  facts: [amber kite stored in barn]
  sources: [interaction:correction]
  instruction: Use operation ID $operation_id. This is a user report, not a direct artifact
    inspection; its interaction source ref is $source, observed at $clock. Preserve the scope and
    evidence.
allowed_mutations: [node:update, node:create, receipt:create]
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /graph/main/facts
    op: contains
    value:
      label: amber kite stored in loft
      scope: orchard
      id: old
      status: superseded
      sources:
        - interaction:earlier
  - path: /graph/main/facts
    op: contains
    value:
      label: amber kite stored in barn
      scope: orchard
      status: active
  - path: /graph/main/facts
    op: linked
    value:
      source:
        id: old
      target:
        label: amber kite stored in barn
        scope: orchard
        status: active
      field: superseded_by
  - path: /publication/atomic_transition
    op: equals
    value: true
  - path: /answer/current_facts
    op: equals
    value:
      - amber kite stored in barn
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 7
