# Case: Two scopes contain different ladder memories. Return only the orchard result
# and do not expose the laboratory result or modify the graph.
id: scope-search
category: scope
prompts:
  - In the orchard scope, where is the ladder?
scope: orchard
fixture:
  main:
    nodes:
      orchard-ladder:
        label: ladder is in shed
      lab-ladder:
        label: ladder is in lab
        scope: laboratory
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: find
  query: ladder
  targets: [orchard-ladder]
  facts: [ladder is in shed]
  forbidden: [lab-ladder]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - orchard-ladder
  - path: /answer/facts
    op: equals
    value:
      - ladder is in shed
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 10
