# Case: Follow a directed edge with an unfamiliar label between unfamiliar node
# kinds. The skill should handle the vocabulary as graph data, not a built-in
# list.
id: novel-vocabulary
category: generality
prompts:
  - What does the glimmer tram frobulate?
scope: orchard
fixture:
  main:
    nodes:
      g:
        label: glimmer tram
        kind: transportation-oddity
        edges:
          - label: frobulate
            to: p
      p:
        label: paper moon
        kind: crafted-satellite
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: traversal
  query: glimmer tram
  root: g
  edge: frobulate
  depth: 1
  targets: [p]
  facts: [paper moon]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - p
  - path: /graph/main/edges
    op: contains
    value:
      from: g
      label: frobulate
      to: p
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 17
