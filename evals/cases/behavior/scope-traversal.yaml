# Case: Follow the orchard gate's outgoing route without crossing into the
# laboratory scope. Return the in-scope target and do not expose the other
# one.
id: scope-traversal
category: scope
prompts:
  - Follow the route from the orchard gate without crossing scopes.
scope: orchard
fixture:
  main:
    nodes:
      gate:
        label: gate
        edges:
          - label: route
            to: tree
          - label: route
            to: bench
      tree:
        label: tree
      bench:
        label: lab bench
        scope: laboratory
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: traversal
  query: gate
  root: gate
  edge: route
  depth: 1
  targets: [tree]
  facts: [tree]
  forbidden: [bench]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/node_ids
    op: equals
    value:
      - tree
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 11
