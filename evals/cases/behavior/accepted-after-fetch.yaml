# Case: Remote main is seeded from a separate fixture actor's commit. Fetch
# that snapshot before recalling the fact. This tests fetch, not review or merge.
id: accepted-after-fetch
category: publication
prompts:
  - After the proposal is accepted, fetch and recall it.
scope: workshop
fixture:
  store:
    id: shared-workshop
    mode: read
    main_ref: commit-base
    base_ref: commit-base
    actor_capabilities:
      read: true
      propose: false
      write: false
    remote_rules: no implicit publication
    operation_id:
    allowed_branch_changes: []
    isolation_profile: managed-single-store
  remote_main_ref: commit-accepted
  main:
    nodes: {}
  accepted_fact:
    label: wheel is blue
    scope: workshop
    id: wheel
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: accepted-after-fetch
  query: wheel
  targets: []
  facts: [wheel is blue]
  instruction: The accepted note concerns the wheel. The selected store is read-only
    and attached to a synthetic remote. Fetch the accepted snapshot before recall;
    do not make or publish knowledge changes.
allowed_mutations: [ref:fetch]
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /publication/main_ref
    op: equals
    value: commit-accepted
  - path: /answer/facts
    op: contains
    value: wheel is blue
  - path: /answer/commit
    op: equals
    value: commit-accepted
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 23
