# Case: The shared remote is unavailable. Recall the last fetched fact while making
# clear that its remote freshness cannot be confirmed.
id: offline-stale
category: freshness
prompts:
  - What is known while the remote is unreachable?
scope: orchard
fixture:
  store:
    id: shared-orchard
    mode: read
    main_ref: cached-1
    base_ref: cached-1
    actor_capabilities:
      read: true
      propose: false
      write: false
    remote_rules: no implicit publication
    operation_id:
    allowed_branch_changes: []
    isolation_profile: managed-single-store
  remote: unreachable
  main:
    nodes:
      cart:
        label: cart is red
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: offline-stale
  query: cart
  targets: [cart]
  facts: [cart is red]
  notices: [stale or unknown freshness]
  instruction: The cached record concerns the cart. The selected store is attached read-only; do not
    modify it. Use notice 'stale or unknown freshness' if remote freshness cannot be established.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/facts
    op: contains
    value: cart is red
  - path: /answer/notices
    op: contains
    value: stale or unknown freshness
  - path: /publication/remote_confirmed
    op: equals
    value: false
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 21
