# Case: Recall an already-stored fact across two separate agent contexts that share
# only the graph. This checks reuse, not creating a new memory.
id: fresh-session-recall
category: recall
prompts:
  - Remember that the amber kite is stored in the loft.
  - In a new context, where is the amber kite?
scope: orchard
fixture:
  main:
    nodes:
      kite-1:
        label: amber kite stored in loft
# Controlled trial: expected outcomes and grader selection.
controlled:
  kind: multi
  query: kite
  targets: [kite-1]
  facts: [amber kite stored in loft]
  instruction: Do not modify the store.
allowed_mutations: []
forbidden_actions: []
# Additional checks for imported evidence.
checks:
  - path: /answer/facts
    op: contains
    value: amber kite stored in loft
  - path: /sessions/fresh_context
    op: equals
    value: true
  - path: /sessions/shared_graph_handoff
    op: equals
    value: true
# Dataset metadata.
lane: behavior
clock: '2026-01-15T12:00:00Z'
order: 4
